version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fcp_password}
      POSTGRES_DB: ${POSTGRES_DB:-fcp_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fcp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fcp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: fcp-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-fcp}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-fcp_password}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-fcp_dev}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./infrastructure/docker/mongo/init.js:/docker-entrypoint-initdb.d/init.js
    networks:
      - fcp-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fcp-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - fcp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  fcp-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data: