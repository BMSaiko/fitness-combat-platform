name: CD Pipeline
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      force_deploy:
        description: 'Force deployment (skip some checks)'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: Pre-deployment Validation
  pre-deploy:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'staging' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Validate deployment scripts
        run: |
          echo "🔍 Validating deployment scripts..."
          npm run build
          npm run type-check
          echo "✅ All validation checks passed"
      
      - name: Check deployment readiness
        run: |
          echo "📋 Deployment Readiness Check"
          echo "Environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'staging' }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Force deploy: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_deploy || 'false' }}"
      
      - name: Security scan before deployment
        run: |
          echo "🔒 Running pre-deployment security scan..."
          npm audit --audit-level=moderate
          echo "✅ Security scan passed"

  # Job 2: Build & Package
  build-and-package:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: pre-deploy
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.force_deploy != 'true'
    
    strategy:
      matrix:
        service: [api-gateway, web-admin]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build service
        run: |
          echo "🔨 Building ${{ matrix.service }}"
          if [ "${{ matrix.service }}" = "api-gateway" ]; then
            npm run build --filter=./packages/api-gateway
          elif [ "${{ matrix.service }}" = "web-admin" ]; then
            npm run build --filter=./apps/web-admin
          fi
      
      - name: Build Docker image
        run: |
          echo "🐳 Building Docker image for ${{ matrix.service }}"
          docker build -f infrastructure/docker/Dockerfile.${{ matrix.service }} -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:${{ github.sha }} .
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:latest
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:latest
      
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Job 3: Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [pre-deploy, build-and-package]
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup deployment environment
        run: |
          echo "🔧 Setting up staging environment"
          echo "ENVIRONMENT=staging" >> $GITHUB_ENV
          echo "DEPLOY_TIME=$(date -u +%Y%m%d-%H%M%S)" >> $GITHUB_ENV
      
      - name: Deploy API Gateway
        run: |
          echo "🚀 Deploying API Gateway to staging..."
          # Placeholder for actual deployment
          echo "Deploying to staging environment"
          echo "API Gateway deployment completed"
      
      - name: Deploy Web Admin
        run: |
          echo "🚀 Deploying Web Admin to staging..."
          # Placeholder for actual deployment
          echo "Web Admin deployment completed"
      
      - name: Run database migrations
        run: |
          echo "🗄️ Running database migrations..."
          # Placeholder for migration script
          echo "Migrations completed successfully"
      
      - name: Health check
        run: |
          echo "🏥 Performing health checks..."
          # Wait for services to be ready
          sleep 30
          
          # Health check endpoints
          for i in {1..5}; do
            if curl -f http://staging-api.example.com/health; then
              echo "✅ API Gateway health check passed"
              break
            else
              echo "⚠️ API Gateway health check failed, retrying... ($i/5)"
              sleep 10
            fi
          done
          
          for i in {1..5}; do
            if curl -f http://staging-web.example.com/health; then
              echo "✅ Web Admin health check passed"
              break
            else
              echo "⚠️ Web Admin health check failed, retrying... ($i/5)"
              sleep 10
            fi
          done
      
      - name: Smoke tests
        run: |
          echo "🧪 Running smoke tests..."
          # Placeholder for smoke tests
          echo "Smoke tests completed successfully"
      
      - name: Notify staging deployment
        run: |
          echo "📢 Staging deployment completed!"
          echo "Environment: staging"
          echo "Services deployed: API Gateway, Web Admin"
          echo "Health checks: passed"
          echo "Smoke tests: passed"

  # Job 4: Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [pre-deploy, build-and-package, deploy-staging]
    environment: production
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup deployment environment
        run: |
          echo "🔧 Setting up production environment"
          echo "ENVIRONMENT=production" >> $GITHUB_ENV
          echo "DEPLOY_TIME=$(date -u +%Y%m%d-%H%M%S)" >> $GITHUB_ENV
      
      - name: Create deployment backup
        run: |
          echo "💾 Creating deployment backup..."
          # Placeholder for backup creation
          echo "Backup created successfully"
      
      - name: Deploy API Gateway (Blue-Green)
        run: |
          echo "🚀 Deploying API Gateway to production (Blue-Green)..."
          # Placeholder for blue-green deployment
          echo "Blue-Green deployment completed"
      
      - name: Deploy Web Admin (Blue-Green)
        run: |
          echo "🚀 Deploying Web Admin to production (Blue-Green)..."
          # Placeholder for blue-green deployment
          echo "Web Admin deployment completed"
      
      - name: Run production database migrations
        run: |
          echo "🗄️ Running production database migrations..."
          # Placeholder for production migrations
          echo "Production migrations completed"
      
      - name: Production health check
        run: |
          echo "🏥 Performing production health checks..."
          # Wait for services to be ready
          sleep 60
          
          # Health check endpoints
          for i in {1..10}; do
            if curl -f http://api.example.com/health; then
              echo "✅ Production API Gateway health check passed"
              break
            else
              echo "⚠️ Production API Gateway health check failed, retrying... ($i/10)"
              sleep 15
            fi
          done
          
          for i in {1..10}; do
            if curl -f http://admin.example.com/health; then
              echo "✅ Production Web Admin health check passed"
              break
            else
              echo "⚠️ Production Web Admin health check failed, retrying... ($i/10)"
              sleep 15
            fi
          done
      
      - name: Production smoke tests
        run: |
          echo "🧪 Running production smoke tests..."
          # Placeholder for production smoke tests
          echo "Production smoke tests completed"
      
      - name: Monitor deployment
        run: |
          echo "📊 Monitoring deployment for 5 minutes..."
          # Placeholder for monitoring
          echo "Monitoring completed - no issues detected"
      
      - name: Cleanup old deployment
        run: |
          echo "🧹 Cleaning up old deployment artifacts..."
          # Placeholder for cleanup
          echo "Cleanup completed"
      
      - name: Notify production deployment
        run: |
          echo "📢 Production deployment completed successfully!"
          echo "Environment: production"
          echo "Deployment method: Blue-Green"
          echo "Services deployed: API Gateway, Web Admin"
          echo "Health checks: passed"
          echo "Smoke tests: passed"
          echo "Monitoring: completed"

  # Job 5: Rollback (Manual Trigger)
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment != ''
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup rollback environment
        run: |
          echo "🔄 Setting up rollback for ${{ github.event.inputs.environment }}"
          echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
      
      - name: Rollback services
        run: |
          echo "🔄 Rolling back ${{ github.event.inputs.environment }} environment..."
          # Placeholder for rollback logic
          echo "Rollback completed successfully"
      
      - name: Verify rollback
        run: |
          echo "✅ Verifying rollback..."
          # Placeholder for rollback verification
          echo "Rollback verification completed"
      
      - name: Notify rollback completion
        run: |
          echo "📢 Rollback completed for ${{ github.event.inputs.environment }}"
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Status: Success"

  # Job 6: Post-deployment Summary
  post-deploy:
    name: Post-deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    
    steps:
      - name: Generate deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Status | Services | Time |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|--------|----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Staging | ${{ needs.deploy-staging.result == 'success' && '✅ Deployed' || '❌ Failed' }} | API Gateway, Web Admin | $(date -u '+%H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| Production | ${{ needs.deploy-production.result == 'success' && '✅ Deployed' || '❌ Failed' }} | API Gateway, Web Admin | $(date -u '+%H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Type:** ${{ github.event_name == 'workflow_dispatch' && 'Manual' || 'Automatic' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔗 Links" >> $GITHUB_STEP_SUMMARY
          echo "- [Staging Environment](https://staging.example.com)" >> $GITHUB_STEP_SUMMARY
          echo "- [Production Environment](https://example.com)" >> $GITHUB_STEP_SUMMARY
          echo "- [Monitoring Dashboard](https://monitoring.example.com)" >> $GITHUB_STEP_SUMMARY
      
      - name: Notify deployment completion
        run: |
          echo "🎉 CD Pipeline completed!"
          echo ""
          echo "Deployment Status:"
          echo "- Staging: ${{ needs.deploy-staging.result == 'success' && '✅ Success' || '❌ Failed' }}"
          echo "- Production: ${{ needs.deploy-production.result == 'success' && '✅ Success' || '❌ Failed' }}"
          echo ""
          echo "Next steps:"
          echo "- Monitor application performance"
          echo "- Check logs for any issues"
          echo "- Verify user functionality"
