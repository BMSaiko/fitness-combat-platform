apiVersion: v1
kind: ConfigMap
metadata:
  name: fitness-combat-config
  namespace: fitness-combat-staging
  labels:
    app: fitness-combat
    environment: staging
data:
  # Application Configuration
  NODE_ENV: "staging"
  PORT: "3000"

  # Database Configuration
  DB_HOST: "postgres-staging"
  DB_PORT: "5432"
  DB_NAME: "fitness_combat_staging"
  DB_SSL: "false"

  # MongoDB Configuration
  MONGODB_URI: "mongodb://mongodb-staging:27017/fitness_combat_staging"

  # Redis Configuration
  REDIS_HOST: "redis-staging"
  REDIS_PORT: "6379"

  # External Services
  JWT_SECRET: "staging-jwt-secret-key-change-in-production"
  API_BASE_URL: "https://api-staging.fitnesscombat.example.com"
  WEB_BASE_URL: "https://staging.fitnesscombat.example.com"

  # Feature Flags
  ENABLE_ANALYTICS: "true"
  ENABLE_NOTIFICATIONS: "true"
  ENABLE_CACHING: "true"

  # Logging
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"

  # Security
  CORS_ORIGIN: "https://staging.fitnesscombat.example.com"
  RATE_LIMIT_WINDOW: "900000"
  RATE_LIMIT_MAX: "100"

  # Monitoring
  METRICS_ENABLED: "true"
  HEALTH_CHECK_PATH: "/health"
  READINESS_CHECK_PATH: "/ready"

  # File Storage
  STORAGE_TYPE: "local"
  UPLOAD_PATH: "/app/uploads"
  MAX_FILE_SIZE: "10485760"

  # Email Configuration
  SMTP_HOST: "smtp-staging.example.com"
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  FROM_EMAIL: "noreply@staging.fitnesscombat.example.com"
